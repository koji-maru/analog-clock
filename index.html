<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>アナログ時計</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3f3f0;
        --face: #ffffff;
        --face-inner: #fdfdfb;
        --ink: #191b1e;
        --ink-soft: #3c4046;
        --muted: #767b83;
        --line: #e3e3dd;
        --ring: #191b1e;
        --accent: #c73a2a;
        --accent-soft: #e8ddd6;
        --sat: #2f5cb8;
        --sun: #c73a2a;
        --shadow: 0 24px 60px rgba(25, 27, 30, 0.13), 0 4px 14px rgba(25, 27, 30, 0.08);
        --hand: #191b1e;
        --hand-minute: #191b1e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1113;
          --face: #1b1e22;
          --face-inner: #212529;
          --ink: #f2f1ec;
          --ink-soft: #d6d8db;
          --muted: #9aa0a8;
          --line: #2e3237;
          --ring: #e8e8e2;
          --accent: #e86a55;
          --accent-soft: #3a2f2c;
          --sat: #7aa2e8;
          --sun: #e86a55;
          --shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.4);
          --hand: #f2f1ec;
          --hand-minute: #f2f1ec;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .stage {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 20px 36px;
        gap: 0;
      }

      /* ---------- Clock ---------- */
      .clock-wrap {
        width: min(82vw, 480px, 58dvh);
        aspect-ratio: 1 / 1;
        flex: none;
      }
      @media (max-height: 560px) {
        .clock-wrap { width: min(82vw, 380px, 52dvh); }
      }
      .clock-svg {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 22px 38px rgba(0,0,0,0.10));
      }
      @media (prefers-color-scheme: dark) {
        .clock-svg { filter: drop-shadow(0 22px 38px rgba(0,0,0,0.5)); }
      }

      .face { fill: var(--face); stroke: var(--line); stroke-width: 1; }
      .face-inner { fill: var(--face-inner); }
      .outer-ring { fill: none; stroke: var(--ring); stroke-width: 2.5; }
      .tick { stroke: var(--ink); }
      .tick-minor { stroke: var(--muted); }
      .numeral {
        font-family: "EB Garamond", "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-weight: 600;
        fill: var(--ink);
        text-anchor: middle;
        dominant-baseline: central;
      }
      .dial-date {
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 700;
        fill: var(--muted);
        text-anchor: middle;
        letter-spacing: 0.18em;
      }
      .hand-hour { fill: var(--hand); }
      .hand-minute { fill: var(--hand-minute); }
      .hand-second { stroke: var(--accent); fill: var(--accent); }
      .center-cap { fill: var(--accent); stroke: var(--face); }

      /* ---------- Date / digital ---------- */
      .info {
        margin-top: 30px;
        text-align: center;
        max-width: 560px;
      }
      .date-line {
        display: flex;
        align-items: baseline;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px 12px;
        line-height: 1.25;
      }
      .date-main {
        font-size: clamp(26px, 6vw, 36px);
        font-weight: 900;
        letter-spacing: 0.03em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .weekday {
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: var(--ink);
      }
      .weekday.is-sunday { color: var(--sun); }
      .weekday.is-saturday { color: var(--sat); }
      .weekday::before { content: "（"; color: var(--muted); font-weight: 500; }
      .weekday::after  { content: "）"; color: var(--muted); font-weight: 500; }

      .digital-row {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
      }
      .ampm {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        border: 1px solid var(--line);
        background: var(--face);
        color: var(--ink-soft);
        padding: 4px 9px 5px;
        border-radius: 999px;
        line-height: 1;
      }
      .digital {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
      }
      .digital .sec { color: var(--muted); font-size: 16px; }

      .note {
        margin-top: 18px;
        font-size: 12.5px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      /* ---------- Wake lock (keep screen on) ---------- */
      .wakelock {
        margin-top: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .wakelock-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        background: var(--face);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 18px 11px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }
      .wakelock-btn:active { transform: scale(0.98); }
      .wakelock-btn .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .wakelock-btn.is-on {
        color: var(--ink);
        border-color: var(--accent);
      }
      .wakelock-btn.is-on .dot {
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      .wakelock-status {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--muted);
        min-height: 1.4em;
        margin: 0;
      }

      @media (max-width: 380px) {
        .date-main { font-size: 24px; }
        .weekday { font-size: 20px; }
        .info { margin-top: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="clock-wrap" role="img" aria-label="現在時刻を示すアナログ時計" id="clockWrap">
        <svg class="clock-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Face -->
          <circle class="face" cx="200" cy="200" r="196" />
          <circle class="face-inner" cx="200" cy="200" r="178" />
          <circle class="outer-ring" cx="200" cy="200" r="194" />

          <!-- Ticks & numerals generated by script -->
          <g id="ticks"></g>
          <g id="numerals"></g>

          <!-- Date inside the dial, like a watch date line -->
          <text class="dial-date" id="dialDate" x="200" y="278" font-size="13">—</text>

          <!-- Hands -->
          <g id="hourHand">
            <polygon class="hand-hour" points="193.5,208 200,118 206.5,208 200,218" />
          </g>
          <g id="minuteHand">
            <polygon class="hand-minute" points="195.5,210 200,74 204.5,210 200,219" />
          </g>
          <g id="secondHand">
            <line class="hand-second" x1="200" y1="232" x2="200" y2="62" stroke-width="2.4" stroke-linecap="round" />
            <circle class="hand-second" cx="200" cy="232" r="4" stroke="none" />
          </g>
          <circle class="center-cap" cx="200" cy="200" r="8.5" stroke-width="2.5" />
          <circle cx="200" cy="200" r="2.6" fill="var(--face)" />
        </svg>
      </div>

      <section class="info" aria-live="off">
        <div class="date-line">
          <span class="date-main" id="dateMain">----年--月--日</span>
          <span class="weekday" id="weekday">-曜日</span>
        </div>
        <div class="digital-row">
          <span class="ampm" id="ampm">--</span>
          <span class="digital" id="digital">--:--<span class="sec">:--</span></span>
        </div>
        <p class="note">日本標準時（JST）</p>

        <div class="wakelock">
          <button type="button" class="wakelock-btn" id="wakeLockBtn" aria-pressed="false">
            <span class="dot" aria-hidden="true"></span>
            <span id="wakeLockLabel">画面をスリープさせない</span>
          </button>
          <p class="wakelock-status" id="wakeLockStatus"></p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var CX = 200, CY = 200;
        var ticks = document.getElementById('ticks');
        var numerals = document.getElementById('numerals');
        var NS = 'http://www.w3.org/2000/svg';

        // Build minute / hour ticks
        for (var i = 0; i < 60; i++) {
          var isHour = i % 5 === 0;
          var angle = (i * 6) * Math.PI / 180;
          var rOuter = 178;
          var rInner = isHour ? 158 : 168;
          var line = document.createElementNS(NS, 'line');
          line.setAttribute('x1', CX + Math.sin(angle) * rInner);
          line.setAttribute('y1', CY - Math.cos(angle) * rInner);
          line.setAttribute('x2', CX + Math.sin(angle) * rOuter);
          line.setAttribute('y2', CY - Math.cos(angle) * rOuter);
          line.setAttribute('class', isHour ? 'tick' : 'tick tick-minor');
          line.setAttribute('stroke-width', isHour ? 3.4 : 1.3);
          line.setAttribute('stroke-linecap', 'round');
          if (!isHour) line.setAttribute('opacity', '0.55');
          ticks.appendChild(line);
        }

        // Build numerals 1–12
        for (var n = 1; n <= 12; n++) {
          var a = (n * 30) * Math.PI / 180;
          var r = 132;
          var t = document.createElementNS(NS, 'text');
          t.setAttribute('x', CX + Math.sin(a) * r);
          t.setAttribute('y', CY - Math.cos(a) * r + 2);
          t.setAttribute('class', 'numeral');
          t.setAttribute('font-size', n === 12 ? 40 : 36);
          t.textContent = String(n);
          numerals.appendChild(t);
        }

        var hourHand = document.getElementById('hourHand');
        var minuteHand = document.getElementById('minuteHand');
        var secondHand = document.getElementById('secondHand');
        var dateMain = document.getElementById('dateMain');
        var weekdayEl = document.getElementById('weekday');
        var dialDate = document.getElementById('dialDate');
        var digitalEl = document.getElementById('digital');
        var ampmEl = document.getElementById('ampm');
        var clockWrap = document.getElementById('clockWrap');

        var WEEKDAYS = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
        var WEEKDAYS_SHORT = ['日', '月', '火', '水', '木', '金', '土'];
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var lastDateKey = '';
        var lastSecond = -1;

        function pad2(v) { return (v < 10 ? '0' : '') + v; }

        function render(now) {
          var ms = now.getMilliseconds();
          var s = now.getSeconds();
          var m = now.getMinutes();
          var h = now.getHours();

          var secDeg, minDeg, hourDeg;
          if (reduceMotion) {
            secDeg = s * 6;
            minDeg = m * 6;
            hourDeg = (h % 12) * 30 + m * 0.5;
          } else {
            var secFloat = s + ms / 1000;
            var minFloat = m + secFloat / 60;
            var hourFloat = (h % 12) + minFloat / 60;
            secDeg = secFloat * 6;
            minDeg = minFloat * 6;
            hourDeg = hourFloat * 30;
          }

          hourHand.setAttribute('transform', 'rotate(' + hourDeg + ' 200 200)');
          minuteHand.setAttribute('transform', 'rotate(' + minDeg + ' 200 200)');
          secondHand.setAttribute('transform', 'rotate(' + secDeg + ' 200 200)');

          // Digital + date only need updating once per second / per day
          if (s !== lastSecond) {
            lastSecond = s;
            var ampm = h < 12 ? '午前' : '午後';
            var h12 = h % 12 === 0 ? 12 : h % 12;
            ampmEl.textContent = ampm;
            digitalEl.innerHTML = pad2(h) + ':' + pad2(m) + '<span class="sec">:' + pad2(s) + '</span>';
            clockWrap.setAttribute('aria-label',
              '現在時刻 ' + ampm + h12 + '時' + m + '分' + s + '秒');
          }

          var dateKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
          if (dateKey !== lastDateKey) {
            lastDateKey = dateKey;
            var dow = now.getDay();
            dateMain.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
            weekdayEl.textContent = WEEKDAYS[dow];
            weekdayEl.classList.toggle('is-sunday', dow === 0);
            weekdayEl.classList.toggle('is-saturday', dow === 6);
            dialDate.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + WEEKDAYS_SHORT[dow];
            document.title = 'アナログ時計 — ' + (now.getMonth() + 1) + '/' + now.getDate() + '（' + WEEKDAYS_SHORT[dow] + '）';
          }
        }

        function loop() {
          render(new Date());
          requestAnimationFrame(loop);
        }
        render(new Date());
        requestAnimationFrame(loop);

        /* ---------- Screen Wake Lock: keep the display on ---------- */
        var wakeBtn = document.getElementById('wakeLockBtn');
        var wakeLabel = document.getElementById('wakeLockLabel');
        var wakeStatus = document.getElementById('wakeLockStatus');
        var wakeLock = null;
        var wantWakeLock = false;

        function setWakeUI(on, msg) {
          wakeBtn.classList.toggle('is-on', on);
          wakeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
          wakeLabel.textContent = on ? 'スリープ防止中（タップで解除）' : '画面をスリープさせない';
          if (typeof msg === 'string') wakeStatus.textContent = msg;
        }

        function requestWakeLock() {
          if (!('wakeLock' in navigator)) {
            setWakeUI(false, 'このブラウザは画面の常時点灯に対応していません');
            return Promise.resolve(false);
          }
          return navigator.wakeLock.request('screen').then(function (lock) {
            wakeLock = lock;
            lock.addEventListener('release', function () {
              wakeLock = null;
              if (wantWakeLock && document.visibilityState === 'visible') {
                // Browser released it (e.g. low battery policy); try to re-acquire
                requestWakeLock();
              } else if (!wantWakeLock) {
                setWakeUI(false, '');
              }
            });
            setWakeUI(true, '点灯中は画面が自動で消えません');
            return true;
          }).catch(function () {
            wakeLock = null;
            setWakeUI(false, '有効にできませんでした。もう一度タップしてください');
            return false;
          });
        }

        wakeBtn.addEventListener('click', function () {
          if (wantWakeLock) {
            wantWakeLock = false;
            if (wakeLock) {
              wakeLock.release();
              wakeLock = null;
            }
            setWakeUI(false, '');
          } else {
            wantWakeLock = true;
            requestWakeLock().then(function (ok) {
              if (!ok) wantWakeLock = false;
            });
          }
        });

        // Wake locks are dropped when the tab is hidden; re-acquire on return
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && wantWakeLock && !wakeLock) {
            requestWakeLock();
          }
        });

        if (!('wakeLock' in navigator)) {
          wakeStatus.textContent = 'このブラウザは画面の常時点灯に対応していません';
        }
      })();
    </script>
  </body>
</html>
